---
# Internal helpers — not meant to be overridden.

_linux_users_present: >-
  {{ (linux_users | rejectattr('state', 'defined') | list)
     + (linux_users | selectattr('state', 'defined')
                    | rejectattr('state', 'equalto', 'absent') | list) }}

_linux_users_absent: >-
  {{ linux_users | selectattr('state', 'defined')
                 | selectattr('state', 'equalto', 'absent') | list }}

# Users that get a /etc/sudoers.d drop-in, i.e. those with `sudo: true`.
_linux_users_sudo: >-
  {{ _linux_users_present | selectattr('sudo', 'defined') | selectattr('sudo') | list }}

# Users whose drop-in must be gone again: sudo unset/false, or removed users.
_linux_users_nosudo: >-
  {{ (_linux_users_present | rejectattr('sudo', 'defined') | list)
     + (_linux_users_present | selectattr('sudo', 'defined')
                             | rejectattr('sudo') | list)
     + (_linux_users_absent | list) }}

_linux_users_ssh_keys: >-
  {{ _linux_users_present | selectattr('ssh_keys', 'defined') | list }}

# Keyword -> value for the sshd drop-in, in the order they are written.
_linux_sshd_settings:
  PubkeyAuthentication: "{{ linux_sshd_pubkey_authentication }}"
  PasswordAuthentication: "{{ linux_sshd_password_authentication }}"
  KbdInteractiveAuthentication: "{{ linux_sshd_kbd_interactive_authentication }}"
  PermitRootLogin: "{{ linux_sshd_permit_root_login }}"
  MaxAuthTries: "{{ linux_sshd_max_auth_tries }}"

# The port Ansible connects to over SSH.
_linux_ufw_ssh_port: "{{ ansible_port | default(22) | int }}"

# Whether linux_ufw_rules lets that port in: an incoming allow or limit rule
# for tcp (or every protocol) whose port, range or list of ports holds it, or
# that names no port at all. Where the rule allows connections from is not
# checked.
_linux_ufw_ssh_allowed: >-
  {%- set ns = namespace(found=false) -%}
  {%- for r in linux_ufw_rules
        if not (r.remove | default(false) | bool)
        and r.rule | default('allow') in ['allow', 'limit']
        and r.direction | default('in') == 'in'
        and r.proto | default('tcp') in ['any', 'tcp'] -%}
    {%- for p in (r.port | default('1:65535') | string).split(',') -%}
      {%- set bounds = p.split(':') | map('int') | list -%}
      {%- if bounds[0] <= (_linux_ufw_ssh_port | int) <= bounds[-1] -%}
        {%- set ns.found = true -%}
      {%- endif -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ ns.found }}

# The DOCKER-USER rules of each IP version, with the UFW file that holds them
# and the iptables command that loads them.
_linux_ufw_after_rules:
  - file: /etc/ufw/after.rules
    command: iptables
    rules: "{{ linux_ufw_docker_user_rules }}"
  - file: /etc/ufw/after6.rules
    command: ip6tables
    rules: "{{ linux_ufw_docker_user_rules_ipv6 }}"

# What linux_hosts accepts as an address: a dotted-quad IPv4 address, or
# anything made of hex digits, colons and dots with at least one colon in it.
# The latter is loose, but tells an IPv6 address from a host name.
_linux_hosts_ip_pattern: >-
  ((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])|[0-9A-Fa-f.]*:[0-9A-Fa-f:.]*

# Where each family looks for local CA certificates, and the command that
# rebuilds the trust store from them. Without --fresh, update-ca-certificates
# leaves the /etc/ssl/certs links of a removed certificate behind.
_linux_ca_trust:
  Debian:
    dir: /usr/local/share/ca-certificates
    command: [update-ca-certificates, --fresh]
  RedHat:
    dir: /etc/pki/ca-trust/source/anchors
    command: [update-ca-trust, extract]

# The PEM certificate of the linux_ca_certificates entry in `item`, given inline
# or read from a file on the controller, without surrounding whitespace.
_linux_ca_certificate: >-
  {{ (item.content if item.content is defined
      else lookup('ansible.builtin.file', item.src)) | trim }}

# Whether repositories.yml added or changed a repository in this run. The
# results are undefined when it was skipped altogether.
_linux_repositories_changed: >-
  {{ ((linux_apt_repositories_result | default({})) is changed)
     or ((linux_apt_repositories_legacy_result | default({})) is changed)
     or ((linux_yum_repositories_result | default({})) is changed) }}

# In check mode a repository added in the same run is not really written, so
# apt/dnf cannot find its packages yet. True when that is the only error in
# _linux_packages_result: apt stops at the first such package and only sets
# `msg`, dnf lists every one of them in `failures`.
_linux_packages_unavailable: >-
  {{ _linux_packages_result.failures
       | default([_linux_packages_result.msg | default('')], true)
       | reject('search', '^No package.* available') | list | length == 0 }}

# Whether _linux_storage_result failed only because check mode never really
# created what it needs: its error says that something does not exist, and
# _linux_storage_created says the task adding that thing reported a change.
_linux_storage_pending: >-
  {{ ansible_check_mode and _linux_storage_created
     and _linux_storage_result is failed
     and _linux_storage_result.msg | default('') is search(_linux_storage_missing) }}

# How lvg, lvol, filesystem and file report a missing partition, volume group,
# logical volume, user or group.
_linux_storage_missing: '^Device .* not found|^Volume group .* does not exist|failed to look up (user|group)'

# The errors of the storage items let through by _linux_storage_pending.
_linux_storage_unchecked: >-
  {{ (linux_lvm_volume_groups_result.results + linux_lvm_volumes_result.results
      + linux_filesystems_result.results + linux_mount_points_result.results)
     | selectattr('changed') | map(attribute='msg', default='')
     | select('search', _linux_storage_missing) | list }}
