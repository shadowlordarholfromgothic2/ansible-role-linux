---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the still-running checks of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: yamllint --strict --format github .

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Installs requirements.yml itself and annotates the PR diff.
      - run: ansible-lint

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # The host's AppArmor profile for unix_chkpwd also confines it inside
      # privileged containers, and the one in Ubuntu 24.04 lacks the capability
      # to read an /etc/shadow with mode 0000, which is how EL ships it. pam_unix
      # needs the helper there, so every sudo in the Rocky Linux instance fails
      # ("PAM account management error"). Newer AppArmor releases grant it.
      - name: Let unix_chkpwd read the EL shadow file
        run: |
          if [ -f /etc/apparmor.d/unix-chkpwd ]; then
            echo 'capability dac_read_search,' | sudo tee -a /etc/apparmor.d/local/unix-chkpwd
            sudo apparmor_parser -r /etc/apparmor.d/unix-chkpwd
          fi

      - run: molecule test
