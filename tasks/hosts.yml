---
# The resolver skips a line whose address it cannot parse, without a word, so
# the entries are checked on the controller before anything changes.
- name: Check the /etc/hosts entries
  ansible.builtin.assert:
    that:
      - item.name | string is regex('[^\s#]+', match_type='fullmatch')
      - item.ip | string is regex(_linux_hosts_ip_pattern, match_type='fullmatch')
    fail_msg: >-
      The /etc/hosts entry {{ item.name | string | to_json }} ->
      {{ item.ip | string | to_json }} is invalid: `name` must be a single host
      name, without whitespace or '#', and `ip` an IPv4 or IPv6 address.
    quiet: true
  loop: "{{ linux_hosts }}"
  loop_control:
    label: "{{ item.name }}"

# Rewritten as a whole, so the block holds exactly the listed entries. In a
# container /etc/hosts is usually a bind mount, which cannot be replaced by
# renaming a file over it; unsafe_writes lets the module write it in place
# then, and only then.
- name: Write the entries to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BLOCK: linux_hosts"
    block: |-
      {% for entry in linux_hosts %}
      {{ '%-15s %s' | format(entry.ip, entry.name) }}
      {% endfor %}
    state: "{{ 'present' if linux_hosts | length > 0 else 'absent' }}"
    unsafe_writes: true
