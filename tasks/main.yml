---
- name: Gather facts when the play did not
  ansible.builtin.setup:
  when: ansible_facts.os_family is not defined
  tags: [always]

- name: Assert that the target platform is supported
  ansible.builtin.assert:
    that: ansible_facts.os_family in ['Debian', 'RedHat']
    fail_msg: >-
      The linux role supports Debian- and RedHat-family hosts,
      this one reports os_family '{{ ansible_facts.os_family }}'.
    quiet: true
  tags: [always]

- name: Configure the timezone
  ansible.builtin.include_tasks:
    file: timezone.yml
    apply:
      tags: [linux, timezone]
  when: linux_timezone | length > 0
  tags: [linux, timezone]

# Before the repositories, which may be served with a certificate of these CAs.
- name: Configure the trusted CA certificates
  ansible.builtin.include_tasks:
    file: ca_certificates.yml
    apply:
      tags: [linux, ca_certificates]
  when: linux_ca_certificates | length > 0
  tags: [linux, ca_certificates]

- name: Configure additional package repositories
  ansible.builtin.include_tasks:
    file: repositories.yml
    apply:
      tags: [linux, repositories]
  when: (linux_apt_keys | length > 0) or (linux_apt_repositories | length > 0) or
        (linux_apt_repositories_legacy | length > 0) or (linux_yum_repositories | length > 0)
  tags: [linux, repositories]

- name: Upgrade the installed packages
  ansible.builtin.include_tasks:
    file: upgrade.yml
    apply:
      tags: [linux, upgrade]
  when: linux_upgrade | bool
  tags: [linux, upgrade]

- name: Install packages
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: [linux, packages]
  when: (linux_packages | length > 0) or (linux_packages_absent | length > 0)
  tags: [linux, packages]

- name: Configure users
  ansible.builtin.include_tasks:
    file: users.yml
    apply:
      tags: [linux, users]
  when: (linux_users | length > 0) or (linux_groups | length > 0)
  tags: [linux, users]

- name: Configure the SSH server
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: [linux, ssh]
  when: linux_sshd_configure | bool
  tags: [linux, ssh]

- name: Configure storage
  ansible.builtin.include_tasks:
    file: storage.yml
    apply:
      tags: [linux, storage]
  when: (linux_partitions | length > 0) or (linux_lvm_volume_groups | length > 0) or
        (linux_lvm_volumes | length > 0) or (linux_filesystems | length > 0) or
        (linux_mounts | length > 0)
  tags: [linux, storage]

- name: Configure sysctl settings
  ansible.builtin.include_tasks:
    file: sysctl.yml
    apply:
      tags: [linux, sysctl]
  when: (linux_sysctl | length > 0) or (linux_sysctl_absent | length > 0)
  tags: [linux, sysctl]

- name: Configure resource limits
  ansible.builtin.include_tasks:
    file: limits.yml
    apply:
      tags: [linux, limits]
  when: (linux_limits | length > 0) or (linux_systemd_limits | length > 0)
  tags: [linux, limits]
